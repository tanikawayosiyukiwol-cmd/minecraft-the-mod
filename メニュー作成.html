<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メニュー管理</title>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #14181c; --panel: #1b2126; --panel-alt: #20272d; --border: #313a41;
    --text: #e7e4dc; --text-dim: #8f9aa1; --amber: #e8a94c; --red: #e2604f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Hiragino Sans',sans-serif; padding:20px 14px 60px; }
  .wrap { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:18px; margin:0; }
  .panel { border:1px solid var(--border); background:var(--panel); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .banner { font-size:12px; padding:9px 11px; border-radius:5px; border-left:3px solid var(--red); background:rgba(226,96,79,0.1); }
  .banner--info { border-left-color:#4fd1c5; background:rgba(79,209,197,0.08); }
  input[type=text], input[type=number] { width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text); padding:9px; border-radius:5px; font-size:14px; }
  .btn { font-family:inherit; font-size:13px; padding:9px 16px; border-radius:5px; border:1px solid var(--border); background:var(--panel-alt); color:var(--text); cursor:pointer; }
  .btn--primary { background:var(--amber); color:#1b1508; border-color:var(--amber); font-weight:600; }
  .btn--danger { background:transparent; color:var(--red); border-color:var(--red); }
  .row { display:flex; gap:8px; }
  .row input:nth-child(1) { width:70px; flex-shrink:0; }
  .row input:nth-child(3) { width:90px; flex-shrink:0; }
  .menu-item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #262e34; font-size:14px; }
  .menu-item .num { font-family:monospace; color:var(--amber); width:36px; flex-shrink:0; }
  .menu-item .name { flex:1; }
  .menu-item .price { color:var(--text-dim); width:70px; text-align:right; flex-shrink:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍽 メニュー管理</h1>
  <div id="banner" class="banner" hidden></div>

  <div class="panel">
    <div class="row">
      <input type="text" id="numInput" placeholder="番号">
      <input type="text" id="nameInput" placeholder="料理名">
      <input type="number" id="priceInput" placeholder="値段">
    </div>
    <button id="addBtn" class="btn btn--primary">＋ 追加 / 上書き</button>
  </div>

  <div class="panel">
    <div id="menuList"></div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDBbV89C3tLId929jyK2Ay97BYISkNeOBg",
  authDomain: "tsuusinkikai-comm-tool.firebaseapp.com",
  databaseURL: "https://tsuusinkikai-comm-tool-default-rtdb.firebaseio.com",
  projectId: "tsuusinkikai-comm-tool",
  storageBucket: "tsuusinkikai-comm-tool.firebasestorage.app",
  messagingSenderId: "632458639323",
  appId: "1:632458639323:web:22b7a3e1aae983d6c959fe"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

function showBanner(msg, type) {
  const el = document.getElementById('banner');
  el.textContent = msg;
  el.hidden = false;
  el.className = 'banner' + (type === 'info' ? ' banner--info' : '');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

db.ref('saizeriya_menu').on('value', (snap) => {
  const menu = snap.val() || {};
  const numbers = Object.keys(menu).sort((a, b) => Number(a) - Number(b));
  const el = document.getElementById('menuList');
  if (!numbers.length) {
    el.innerHTML = '<p style="color:var(--text-dim); font-size:13px;">まだメニューが登録されていません。</p>';
    return;
  }
  el.innerHTML = numbers.map(n => {
    const item = menu[n];
    return '<div class="menu-item">' +
      '<span class="num">' + escapeHtml(n) + '</span>' +
      '<span class="name">' + escapeHtml(item.name || '') + '</span>' +
      '<span class="price">' + (item.price ? item.price + '円' : '') + '</span>' +
      '<button class="btn btn--danger del-btn" data-num="' + n + '">削除</button>' +
      '</div>';
  }).join('');
  el.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('saizeriya_menu/' + btn.dataset.num).remove();
    });
  });
});

document.getElementById('addBtn').addEventListener('click', () => {
  const num = document.getElementById('numInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  const price = parseInt(document.getElementById('priceInput').value, 10) || 0;
  if (!num || !name) return showBanner('番号と料理名を入力してください。');
  db.ref('saizeriya_menu/' + num).set({ name, price }).then(() => {
    document.getElementById('numInput').value = '';
    document.getElementById('nameInput').value = '';
    document.getElementById('priceInput').value = '';
    showBanner('保存しました。', 'info');
  });
});
</script>
</body>
</html>
