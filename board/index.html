<script>
(function(){
  try{
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/minecraft-the-mod/site-config.json?t=' + Date.now(), false);
    xhr.send(null);
    if(xhr.status === 200){
      var cfg = JSON.parse(xhr.responseText);
      if(cfg.maintenance === true && location.pathname.indexOf('/maintenance/') === -1){
        location.replace('/minecraft-the-mod/maintenance/');
      }
    }
  }catch(e){}
})();
</script>

  <!--
    ▼▼▼ セットアップ手順（コメント欄と同じ要領です）▼▼▼
    1. https://giscus.app を開く
    2. リポジトリ名を入力
    3. 「Discussionで使用するカテゴリ」で、掲示板用に新しく作ったカテゴリ（例: Board）を選ぶ

    4. 生成されたコードの data-category と data-category-id を、下のscriptタグに反映する
    5. data-mapping="specific" にし、data-term="board" のままにすると、
       このページ専用の固定スレッドになります（記事ごとに自動でスレッドが分かれるコメント欄とは違う動きです）
  -->
  <script src="https://giscus.app/client.js"
    data-repo="tanikawayosiyukiwol-cmd/minecraft-the-mod"
    data-repo-id="R_kgDOSqRc3g"
    data-category="【giscus.appで「Board」カテゴリを作成後、カテゴリ名に書き換えてください】"
