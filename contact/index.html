<script>
(function(){
  try{
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/minecraft-the-mod/site-config.json?t=' + Date.now(), false);
    xhr.send(null);
    if(xhr.status === 200){
      var cfg = JSON.parse(xhr.responseText);
      if(cfg.maintenance === true && location.pathname.indexOf('/maintenance/') === -1){
        location.replace('/minecraft-the-mod/maintenance/');
      }
    }
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#f7faf8;--surface:#ffffff;--surface2:#eef6f0;--border:rgba(46,230,107,.22);--border2:rgba(46,230,107,.4);
  --cyan:#2ee66b;--gold:#ff5252;--text:#16241b;--muted:#5f7466;--muted2:#93a89b;
  --pixel:"Press Start 2P";--sans:"Noto Sans JP",sans-serif;--mono:"JetBrains Mono",monospace;--r:6px;--r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:0 1.5rem}
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border2);height:56px;display:flex;align-items:center;padding:0 1.5rem}
.topbar a{color:var(--muted);text-decoration:none;font-size:13px}
.topbar a:hover{color:var(--cyan)}
h1{font-family:var(--pixel);font-size:clamp(13px,3vw,18px);line-height:1.9;color:var(--text);padding:2.5rem 0 .6rem;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:2rem;line-height:1.8}
.box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);padding:1.8rem}
label{display:block;font-size:12.5px;color:var(--cyan);margin-bottom:.4rem;font-weight:700}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);
  color:var(--text);font-family:var(--sans);font-size:13.5px;padding:.7rem .9rem;margin-bottom:1.2rem}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:none;cursor:pointer;font-weight:700;
  border-radius:var(--r);padding:.75rem 1.6rem;font-size:13.5px;background:var(--cyan);color:#000;width:100%;justify-content:center}
.btn:hover{filter:brightness(1.12)}
.note{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:1rem;text-align:center}
footer{padding:2.5rem 0;text-align:center;color:var(--muted2);font-size:11.5px;font-family:var(--mono);
  border-top:1px solid var(--border);margin-top:2rem}
</style>

<div class="wrap">
  <h1>お問い合わせ</h1>
  <p class="sub">Modの不具合報告、ご要望、掲載に関するご相談などはこちらからお送りください。</p>

  <div class="box">
    <form action="mailto:tanikawayosiyukiwol@gmail.com" method="get">
      <label for="name">お名前（ニックネーム可）</label>
      <input type="text" id="name" name="name" required>

      <label for="email">返信用メールアドレス</label>
      <input type="email" id="email" name="email" required>

      <label for="type">お問い合わせ種別</label>
      <select id="type" name="type">
        <option>Modの不具合報告</option>
        <option>Modへのご要望</option>
        <option>掲載・コラボについて</option>
        <option>その他</option>
      </select>

      <label for="message">お問い合わせ内容</label>
      <textarea id="message" name="message" required placeholder="できるだけ詳しくご記入ください（例：使用しているMinecraft/Forgeのバージョン、発生した不具合の内容など）"></textarea>

      <button type="submit" class="btn">✉ 送信する</button>
    </form>
    <div class="note">送信すると、お使いのメールアプリが開き下書きが作成されます。内容をご確認のうえ送信してください。</div>
  </div>
