<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向幕ディスプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=IBM+Plex+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14181c;
    --panel: #1b2126;
    --panel-alt: #20272d;
    --border: #313a41;
    --text: #e7e4dc;
    --text-dim: #8f9aa1;
    --amber: #e8a94c;
    --teal: #4fd1c5;
    --red: #e2604f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans JP', sans-serif;
  }

  /* --- 接続画面 --- */
  #setup {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .banner { font-size: 12px; padding: 9px 11px; border-radius: 5px; border-left: 3px solid var(--red); background: rgba(226,96,79,0.1); }
  .banner--info { border-left-color: var(--teal); background: rgba(79,209,197,0.08); }
  .guide { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; font-size: 13px; line-height: 1.9; }
  .qr-holder { background: #fff; border-radius: 8px; padding: 12px; display: flex; justify-content: center; }
  .qr-holder svg { width: 100%; max-width: 320px; height: auto; display: block; }
  .qr-holder:empty { padding: 0; }
  .fallback { font-size: 12px; color: var(--text-dim); }
  .fallback summary { cursor: pointer; padding: 4px 0; }
  .fallback[open] summary { color: var(--text); }
  .code-row { display: flex; gap: 8px; align-items: flex-start; }
  textarea { width: 100%; height: 64px; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); font-family: monospace; font-size: 12px; padding: 10px; border-radius: 5px; resize: vertical; }
  .btn { font-family: inherit; font-size: 13px; padding: 9px 16px; border-radius: 5px; border: 1px solid var(--border); background: var(--panel-alt); color: var(--text); cursor: pointer; }
  .btn--primary { background: var(--amber); color: #1b1508; border-color: var(--amber); font-weight: 600; }
  .btn--ghost { background: transparent; }
  .file-label { display: inline-block; text-align: center; }
  [hidden] { display: none !important; }

  /* --- ロール式方向幕（黄地に黒文字、実車準拠） --- */
  .sign-roll {
    position: fixed; inset: 0;
    background: #ffffff;
    overflow: hidden;
  }
  .sign-roll::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.12), transparent 8%, transparent 92%, rgba(0,0,0,0.2));
    pointer-events: none;
    z-index: 2;
  }
  .roll-layer {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center;
    font-family: 'IBM Plex Sans JP', sans-serif;
    transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    will-change: transform;
  }
  .roll-layer .kind {
    font-size: 6vw;
    font-weight: 900;
    padding: 1.2vw 2.4vw;
    margin-left: 3vw;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .roll-layer .dest {
    font-size: 11vw;
    font-weight: 900;
    margin-left: 4vw;
    letter-spacing: 0.02em;
    white-space: nowrap;
    color: #17140f;
  }

  /* --- LED式方向幕（白系ドット文字＋路線カラーのアンダーライン＋漢字/英字2段、実車準拠） --- */
  .sign-led {
    position: fixed; inset: 0;
    background: #000;
    color: #f2f2ea;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    padding-left: 4vw;
  }
  .sign-led .text-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 3vw;
    row-gap: 0.8vw;
    max-width: 92vw;
  }
  .sign-led .kanji {
    font-size: 9vw;
    letter-spacing: 0.08em;
    white-space: nowrap;
    text-shadow: 0 0 6px rgba(242,242,234,0.5);
  }
  .sign-led .romaji {
    font-size: 3.5vw;
    letter-spacing: 0.04em;
    color: #cfcfc4;
    white-space: nowrap;
  }
  .sign-led .underline {
    width: 92vw;
    height: 1.4vw;
    margin-top: 1.5vw;
    border-radius: 2px;
  }

  #displayView { display: none; }

  .sign-idle {
    position: fixed; inset: 0;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    gap: 5vw;
    flex-wrap: wrap;
  }
  .sign-idle img.mascot { height: 20vh; width: auto; }
  .sign-idle img.logo { height: 10vh; width: auto; }
</style>
</head>
<body>

<div id="setup">
  <div class="panel">
    <h1>🚋 方向幕ディスプレイ（表示側）</h1>
    <div id="setupBanner" class="banner" hidden></div>
    <div class="guide">
      <strong>使い方</strong><br>
      ① 下の「連携コードを作る」を押す<br>
      ② 表示されたQRコードを、操作するスマホで読み取ってもらう<br>
      ③ スマホから届いた返事のコードを、下に貼り付けて「接続する」を押す
    </div>

    <div id="step1">
      <button id="startHost" class="btn btn--primary">連携コードを作る</button>
    </div>
    <div id="step2" hidden>
      <div class="qr-holder" id="offerQr"></div>
      <button id="saveOfferFile" class="btn btn--ghost" style="margin-top:8px;">💾 ファイルで保存して送る</button>
      <details class="fallback">
        <summary>QRもファイルも使えない場合（テキストをコピー）</summary>
        <div class="code-row">
          <textarea id="offerCode" readonly></textarea>
          <button id="copyOffer" class="btn btn--ghost">コピー</button>
        </div>
      </details>
    </div>
    <div id="step3" hidden style="margin-top:12px;">
      <p style="font-size:13px;">スマホからの返事のコードを貼り付けてください</p>
      <label class="btn btn--ghost file-label">
        📁 ファイルを読み込む
        <input type="file" id="loadAnswerFile" accept=".txt,text/plain,*/*" hidden>
      </label>
      <textarea id="answerInput" placeholder="返事のコードを貼り付け" style="margin-top:8px;"></textarea>
      <button id="connectHost" class="btn btn--primary" style="margin-top:8px;">接続する</button>
    </div>
  </div>
</div>

<div id="displayView"></div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

  el.className = 'banner' + (type === 'info' ? ' banner--info' : '');
}
function hideBanner(el) { el.hidden = true; }

window.addEventListener('DOMContentLoaded', () => {
  if (!window.isSecureContext) {
    showBanner(document.getElementById('setupBanner'), 'このページが安全な状態（https）で開かれていません（現在: ' + location.protocol + '）。GitHub Pagesなどにアップロードして開いてください。');
  }
});

function waitForIceGathering(conn) {
  return new Promise((resolve) => {
    if (conn.iceGatheringState === 'complete') return resolve();
    const check = () => {
      if (conn.iceGatheringState === 'complete') {
        conn.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    conn.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 4000);
  });
}

// ---- Base45 ----
const BASE45_CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
const BASE45_MAP = (() => { const m = {}; for (let i = 0; i < BASE45_CHARS.length; i++) m[BASE45_CHARS[i]] = i; return m; })();
function base45Encode(bytes) {
  let out = '';
  let i = 0;
  for (; i + 1 < bytes.length; i += 2) {
    let n = (bytes[i] << 8) + bytes[i + 1];
    const c = n % 45; n = (n - c) / 45;
    const d = n % 45; n = (n - d) / 45;
    out += BASE45_CHARS[c] + BASE45_CHARS[d] + BASE45_CHARS[n];
  }
  if (i < bytes.length) {
    const n = bytes[i];
    const c = n % 45;
    const d = (n - c) / 45;
    out += BASE45_CHARS[c] + BASE45_CHARS[d];
  }
  return out;
}
function base45Decode(str) {
  const bytes = [];
  let i = 0;
  while (str.length - i >= 3) {
    const n = BASE45_MAP[str[i]] + BASE45_MAP[str[i + 1]] * 45 + BASE45_MAP[str[i + 2]] * 45 * 45;
    bytes.push((n >> 8) & 0xff, n & 0xff);
    i += 3;
  }
  if (str.length - i === 2) {
    const n = BASE45_MAP[str[i]] + BASE45_MAP[str[i + 1]] * 45;
    bytes.push(n & 0xff);
  }
  return new Uint8Array(bytes);
}

async function encodeDescription(desc) {
  const json = JSON.stringify({ type: desc.type, sdp: desc.sdp });
  if (window.CompressionStream) {
    try {
      const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = await new Response(stream).arrayBuffer();
      return 'GZ:' + base45Encode(new Uint8Array(buf));
    } catch (e) {}
  }
  return 'RAW:' + base45Encode(new TextEncoder().encode(json));
}
async function decodeDescription(code) {
  code = code.trim();
  if (code.startsWith('GZ:')) {
    const bytes = base45Decode(code.slice(3));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }
  if (code.startsWith('RAW:')) {
    return JSON.parse(new TextDecoder().decode(base45Decode(code.slice(4))));
  }
  throw new Error('unknown code format');
}

function renderQrInto(elementId, text) {
  const holder = document.getElementById(elementId);
  holder.innerHTML = '';
  if (!text) return;
  try {
    const qr = qrcode(0, 'L');
    qr.addData(text, 'Alphanumeric');
    qr.make();
    holder.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  } catch (e) {
    holder.innerHTML = '<p style="font-size:11px;color:#555;">コードが長すぎてQR化できませんでした。下の「テキストで送る」をご利用ください。</p>';
  }
}

function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ---- 接続処理（このページがホスト） ----
document.getElementById('startHost').addEventListener('click', async () => {
  try {
    hideBanner(document.getElementById('setupBanner'));
    pc = new RTCPeerConnection({ iceServers: STUN_SERVERS });
    dc = pc.createDataChannel('control');
    dc.onopen = () => {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('displayView').style.display = 'block';
    };
    dc.onmessage = (e) => {
      try { applyDisplay(JSON.parse(e.data)); } catch (err) {}
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGathering(pc);
    const code = await encodeDescription(pc.localDescription);
    document.getElementById('offerCode').value = code;
    renderQrInto('offerQr', code);
    document.getElementById('step1').hidden = true;
    document.getElementById('step2').hidden = false;
    document.getElementById('step3').hidden = false;
  } catch (err) {
    showBanner(document.getElementById('setupBanner'), '準備に失敗しました: ' + err.message);
  }
});

document.getElementById('connectHost').addEventListener('click', async () => {
  try {
    const code = document.getElementById('answerInput').value;
    if (!code) return showBanner(document.getElementById('setupBanner'), 'スマホからの返事のコードを貼り付けてください。');
    await pc.setRemoteDescription(await decodeDescription(code));
    showBanner(document.getElementById('setupBanner'), '接続処理中です…（少し待つとつながります）', 'info');
  } catch (err) {
    showBanner(document.getElementById('setupBanner'), '接続に失敗しました。コードをご確認ください。');
  }
});

document.getElementById('copyOffer').addEventListener('click', async (e) => {
  const v = document.getElementById('offerCode').value;
  if (!v) return;
  try {
    await navigator.clipboard.writeText(v);
    e.target.textContent = 'コピー済';
    setTimeout(() => { e.target.textContent = 'コピー'; }, 1200);
  } catch { alert('コピーできませんでした。手動で選択してコピーしてください。'); }
});
document.getElementById('saveOfferFile').addEventListener('click', () => {
  const v = document.getElementById('offerCode').value;
  if (v) downloadTextFile('display-invite-code.txt', v);
});
document.getElementById('loadAnswerFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const target = document.getElementById('answerInput');
    target.value = reader.result.trim();
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ---- 方向幕の表示 ----
// 駅名のローマ字（写真で確認できたもの以外は推定です。実際の表記に合わせて調整してください）
const STATION_ROMAJI = {
  '高松築港': 'Takamatsu-Chikko',
  '瓦町': 'Kawaramachi',
  '仏生山': 'Bushozan',
  '滝宮': 'Takinomiya',
  '一宮': 'Ichinomiya',
  '琴電琴平': 'Kotoden-Kotohira',
  '長尾': 'Nagao',
  '琴電屋島': 'Kotoden-Yashima',
  '志度': 'Shido'
};
// 長い駅名の略称（正確な実際の略し方は未確認の推測です。違っていたら直してください）
const STATION_ABBR = {
  '高松築港': '築港',
  '琴電琴平': '琴平',
  '琴電屋島': '屋島'
};
function abbr(name) { return STATION_ABBR[name] || name || ''; }

// 路線ごとのアンダーライン色（長尾線=緑、琴平線=黄色は確認済み。志度線は未確認のため仮の色です）
const LINE_COLORS = {
  '琴平線': '#ffd400',
  '長尾線': '#00a650',
  '志度線': '#4a90d9'
};

const SPECIAL_KINDS = ['回送', '試運転', '貸切'];

function applyDisplay(msg) {
  const view = document.getElementById('displayView');

  if (msg.power === false) {
    rollCurrentIndex = -1; // 電源を入れ直したら、幕の位置情報はリセットする
    view.innerHTML =
      '<div class="sign-idle">' +
      '<img class="mascot" src="' + KOTO_B64 + '" alt="ことちゃん">' +
      '<img class="logo" src="' + LOGO_B64 + '" alt="ことでん">' +
      '<img class="mascot" src="' + KOTOMI_B64 + '" alt="ことみちゃん">' +
      '</div>';
    return;
  }

  const isSpecial = SPECIAL_KINDS.includes(msg.kind);
  if (msg.style === 'led') {
    if (isSpecial) {
      view.innerHTML =
        '<div class="sign-led"><div class="text-row">' +
        '<span class="kanji">' + escapeHtml(msg.kind) + '</span>' +
        '</div></div>';
      return;
    }
    const color = LINE_COLORS[msg.line] || '#555';
    const romaji = STATION_ROMAJI[msg.destination] || '';
    const kanjiText = (msg.kind && msg.kind !== '普通' ? msg.kind + '　' : '') + abbr(msg.destination);
    view.innerHTML =
      '<div class="sign-led">' +
      '<div class="text-row">' +
      '<span class="kanji">' + escapeHtml(kanjiText) + '</span>' +
      (romaji ? '<span class="romaji">' + escapeHtml(romaji) + '</span>' : '') +
      '</div>' +
      '<div class="underline" style="background:' + color + ';"></div>' +
      '</div>';
  } else {
    playRollAnimation(msg, isSpecial);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 実際の幕の並び順（駅リストの並び→特殊表示の順、と仮定。正確な並びが分かれば直してください）
const ROLL_SEQUENCE = ['高松築港', '瓦町', '仏生山', '滝宮', '一宮', '琴電琴平', '長尾', '琴電屋島', '志度', '回送', '試運転', '貸切'];
let rollCurrentIndex = -1;
let rollGeneration = 0;

// 準急は赤バッジ確認済み。それ以外の種別バッジは未確認のため仮の黒バッジにしています
function kindBadgeStyle(kind) {
  if (kind === '準急') return 'background:#e2604f; color:#fff;';
  return 'background:#17140f; color:#f0c419;';
}

function scrollDirection(curIdx, newIdx, total) {
  if (curIdx === -1 || newIdx === -1 || curIdx === newIdx) return 'up';
  const forward = (newIdx - curIdx + total) % total;
  const backward = (curIdx - newIdx + total) % total;
  return forward <= backward ? 'up' : 'down';
}

// 現在地から目的地まで、実際に何駅か通り過ぎてからたどり着くよう、経由地点のインデックス列を作る
function buildRollPath(curIdx, newIdx, direction, total) {
  if (curIdx === -1 || newIdx === -1 || curIdx === newIdx) return [newIdx];
  const diff = direction === 'up' ? (newIdx - curIdx + total) % total : (curIdx - newIdx + total) % total;
  const maxHops = Math.min(diff, 4); // 経由地は最大4つまで（近ければそのまま、遠ければ間引く）
  const path = [];
  for (let i = 1; i <= maxHops; i++) {
    const offset = Math.round((i * diff) / maxHops);
    const idx = direction === 'up' ? (curIdx + offset) % total : (curIdx - offset + total) % total;
    path.push(idx);
  }
  if (path[path.length - 1] !== newIdx) path.push(newIdx);
  return path;
}

function rollStepContent(idx, isLastStep, msg) {
  if (isLastStep) {
    const isSpecial = SPECIAL_KINDS.includes(msg.kind);
    const kindHtml = (!isSpecial && msg.kind && msg.kind !== '普通')
      ? '<span class="kind" style="' + kindBadgeStyle(msg.kind) + '">' + escapeHtml(msg.kind) + '</span>'
      : '';
    const text = isSpecial ? msg.kind : (abbr(msg.destination) + (msg.destination ? 'ゆき' : ''));
    return { kindHtml, text };
  }
  const name = ROLL_SEQUENCE[idx];
  const text = SPECIAL_KINDS.includes(name) ? name : (abbr(name) + 'ゆき');
  return { kindHtml: '', text };
}

function runRollStep(path, i, direction, msg, gen) {
  if (gen !== rollGeneration) return; // 途中で新しい指示が来ていたら、この続きは中断する

  const view = document.getElementById('displayView');
  if (!view.querySelector('.sign-roll')) view.innerHTML = '<div class="sign-roll"></div>';
  const container = view.querySelector('.sign-roll');
  const oldLayer = container.querySelector('.roll-layer');

  const isLast = i === path.length - 1;
  const { kindHtml, text } = rollStepContent(path[i], isLast, msg);

  const newLayer = document.createElement('div');
  newLayer.className = 'roll-layer';
  newLayer.innerHTML = kindHtml + '<span class="dest">' + escapeHtml(text) + '</span>';
  newLayer.style.transform = 'translateY(' + (direction === 'up' ? '100%' : '-100%') + ')';
  container.appendChild(newLayer);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (gen !== rollGeneration) return;
      if (oldLayer) oldLayer.style.transform = 'translateY(' + (direction === 'up' ? '-100%' : '100%') + ')';
      newLayer.style.transform = 'translateY(0)';
    });
  });

  setTimeout(() => {
    if (gen !== rollGeneration) return;
    if (oldLayer) oldLayer.remove();
    if (i + 1 < path.length) runRollStep(path, i + 1, direction, msg, gen);
  }, 700);
}

function playRollAnimation(msg, isSpecial) {
  rollGeneration++;
  const gen = rollGeneration;
  const targetKey = isSpecial ? msg.kind : msg.destination;
  const newIdx = ROLL_SEQUENCE.indexOf(targetKey);
  const direction = scrollDirection(rollCurrentIndex, newIdx, ROLL_SEQUENCE.length);
  const path = buildRollPath(rollCurrentIndex, newIdx, direction, ROLL_SEQUENCE.length);
  rollCurrentIndex = newIdx;
  runRollStep(path, 0, direction, msg, gen);
}
