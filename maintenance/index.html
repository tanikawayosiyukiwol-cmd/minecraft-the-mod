<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>メンテナンス中 | マインクラフト.the.Mod</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7faf8;--surface:#ffffff;--surface2:#eef6f0;
  --border:rgba(46,230,107,.22);--border2:rgba(46,230,107,.4);
  --cyan:#2ee66b;--gold:#ff5252;
  --text:#16241b;--muted:#5f7466;--muted2:#93a89b;
  --pixel:"Press Start 2P";--sans:"Noto Sans JP",sans-serif;--mono:"JetBrains Mono",monospace;
  --r:6px;--r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%,rgba(46,230,107,.1) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 85% 90%,rgba(255,82,82,.08) 0%,transparent 55%);}
.wrap{max-width:520px;text-align:center;position:relative;z-index:1}
.icon{font-size:3.4rem;margin-bottom:1.2rem;animation:spin 3.2s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:.35rem .9rem;border-radius:20px;
  background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);color:var(--gold);margin-bottom:1.3rem}
h1{font-family:var(--pixel);font-size:clamp(14px,3.2vw,20px);line-height:2;color:#0e1a13;margin-bottom:1.2rem}
p{font-size:14px;line-height:1.9;color:var(--muted);margin-bottom:.6rem}
.bar{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);
  padding:1.4rem 1.6rem;margin:1.8rem 0;text-align:left}
.bar .row{display:flex;align-items:center;gap:.6rem;font-size:13px;color:var(--text);margin-bottom:.5rem}
.bar .row:last-child{margin-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.links a{color:var(--cyan);text-decoration:none;font-weight:700;font-size:13px}
.links a:hover{text-decoration:underline}
footer{margin-top:2rem;font-family:var(--mono);font-size:11px;color:var(--muted2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">🛠️</div>
  <div class="badge">MAINTENANCE</div>
  <h1>ただいまメンテナンス中です</h1>
  <p>マインクラフト.the.Mod は現在、サイトの改善作業を行っています。<br>ご不便をおかけして申し訳ございません。</p>

  <div class="bar">
    <div class="row"><span class="dot"></span> サイトデザインの更新作業中</div>
    <div class="row"><span class="dot"></span> しばらくお待ちいただくか、後ほど再度アクセスしてください</div>
    <div class="row"><span class="dot"></span>機能の追加などの、制作中</div>
  </div>

  <p class="links">お問い合わせは <a href="mailto:tanikawayosiyukiwol@gmail.com">こちら</a> まで</p>

  <footer>© マインクラフト.the.Mod</footer>
</div>
</body>
</html>
