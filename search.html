<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>検索結果 | マインクラフト.the.Mod</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07101f;--surface:#0e1d33;--surface2:#132340;
  --border:rgba(0,200,255,.12);--border2:rgba(0,200,255,.22);
  --cyan:#00c8ff;--gold:#ffc400;--green:#1ddb6e;--red:#f43f5e;
  --text:#e8f1ff;--muted:#5a7a9a;--muted2:#3a5570;
  --pixel:"Press Start 2P";--sans:"Noto Sans JP",sans-serif;--mono:"JetBrains Mono",monospace;
  --r:6px;--r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,200,255,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,200,255,.018) 1px,transparent 1px);
  background-size:40px 40px;}
.wrap{max-width:960px;margin:0 auto;padding:0 1.5rem;position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,16,31,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border2);
  height:56px;display:flex;align-items:center;gap:1.2rem;padding:0 1.5rem;}
.topbar a{color:var(--muted);text-decoration:none;font-size:13px;flex-shrink:0}
.topbar a:hover{color:var(--cyan)}
.top-search{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.04);
  border:1px solid var(--border2);border-radius:20px;padding:.4rem .9rem;flex:1;max-width:420px;margin-left:auto}
.top-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%}
.top-search input::placeholder{color:var(--muted2)}

.head{padding:2.4rem 0 1.6rem}
.head h1{font-family:var(--pixel);font-size:clamp(13px,3vw,18px);line-height:1.9;color:#fff;margin-bottom:.6rem}
.head p{color:var(--muted);font-size:13.5px}
.head p span{color:var(--cyan);font-family:var(--mono)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem;padding-bottom:3rem}
.card{cursor:pointer;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);
  overflow:hidden;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,200,255,.12)}
.card-thumb{min-height:100px;background:linear-gradient(135deg,#071428,#0f2040);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;position:relative}
.card-body{padding:1rem 1.1rem;flex:1;display:flex;flex-direction:column;gap:.4rem}
.card-title{font-family:var(--pixel);font-size:8.5px;color:#fff;line-height:1.75}
.card-ver{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:.25rem}
.ctag{font-family:var(--mono);font-size:9.5px;padding:.15rem .5rem;border-radius:10px;
  background:rgba(0,200,255,.08);border:1px solid var(--border);color:var(--cyan)}
.card-footer{padding:.7rem 1.1rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.btn-sm{display:inline-flex;align-items:center;gap:.3rem;background:var(--cyan);color:#000;
  font-weight:700;font-size:11.5px;padding:.4rem .9rem;border-radius:var(--r);text-decoration:none}

.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty-icon{font-size:2.2rem;display:block;margin-bottom:.8rem}

footer{padding:2.5rem 0;text-align:center;color:var(--muted2);font-size:11.5px;font-family:var(--mono);
  border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← トップへ戻る</a>
  <div class="top-search">
    <span style="color:var(--muted);font-size:13px">🔍</span>
    <input type="text" id="gsearch" placeholder="検索..."
      onkeydown="if(event.key==='Enter'){location.href='search.html?q='+encodeURIComponent(this.value)}">
  </div>
</div>

<div class="wrap">
  <div class="head">
    <h1 id="head-title">検索結果</h1>
    <p id="head-count"></p>
  </div>

  <div class="grid" id="results"></div>

  <footer>© マインクラフト.the.Mod — Not affiliated with Mojang Studios.</footer>
</div>

<script src="transition.js"></script>
<script>
const TN={mod:"MOD",bedrock:"統合版MOD",tool:"TOOL",world:"WORLD",pack:"PACK"};

function cardHTML(item){
  const link = item.detailUrl || item.url || "#";
  return `<div class="card" onclick="pageGoTo('${link}')">
    <div class="card-thumb">${item.thumb||"📦"}</div>
    <div class="card-body">
      <div class="card-title">${item.title}</div>
      <div class="card-ver">${item.ver||""}</div>
      <p class="card-desc">${item.desc||""}</p>
      <div class="card-tags">${(item.tags||[]).map(t=>`<span class="ctag">${t}</span>`).join("")}</div>
    </div>
    <div class="card-footer">
      <a href="${item.url||"#"}" ${item.url&&item.url!="#"?"download":""} onclick="event.stopPropagation()" class="btn-sm">⬇ DL</a>
    </div>
  </div>`;
}

async function run(){
  const params = new URLSearchParams(location.search);
  const q = (params.get("q")||"").trim();
  document.getElementById("gsearch").value = q;
  document.getElementById("head-title").textContent = q ? `「${q}」の検索結果` : "検索結果";

  let staticData = [];
  try{
    const res = await fetch("data.json");
    staticData = await res.json();
  }catch{ staticData = []; }

  let ls = [];
  try{ ls = JSON.parse(localStorage.getItem("mc_data")||"[]"); }catch{}

  const all = [...staticData, ...ls].filter(x=>x.published);
  const ql = q.toLowerCase();
  const results = q
    ? all.filter(x => (x.title+x.desc+(x.tags||[]).join(" ")).toLowerCase().includes(ql))
    : all;

  document.getElementById("head-count").innerHTML = q
    ? `<span>${results.length}</span> 件見つかりました`
    : `全 <span>${results.length}</span> 件`;

  const grid = document.getElementById("results");
  grid.innerHTML = results.length
    ? results.map(cardHTML).join("")
    : `<div class="empty"><span class="empty-icon">🔍</span>「${q}」に一致するコンテンツは見つかりませんでした</div>`;
}
run();
</script>

</body>
</html>
