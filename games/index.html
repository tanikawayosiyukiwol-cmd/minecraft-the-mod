<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){
  try{
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/minecraft-the-mod/site-config.json?t=' + Date.now(), false);
    xhr.send(null);
    if(xhr.status === 200){
      var cfg = JSON.parse(xhr.responseText);
      if(cfg.maintenance === true && location.pathname.indexOf('/maintenance/') === -1){
        location.replace('/minecraft-the-mod/maintenance/');
      }
    }
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ミニゲーム | マインクラフト.the.Mod</title>
<link rel="icon" type="image/png" sizes="32x32" href="/minecraft-the-mod/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/minecraft-the-mod/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/minecraft-the-mod/favicon-180.png">
<link rel="icon" type="image/x-icon" href="/minecraft-the-mod/favicon.ico">
<meta name="description" content="ブラウザで遊べるMinecraftテーマのミニゲーム集です。">
<link rel="canonical" href="https://tanikawayosiyukiwol-cmd.github.io/minecraft-the-mod/games/">
<meta property="og:type" content="website">
<meta property="og:title" content="ミニゲーム | マインクラフト.the.Mod">
<meta property="og:description" content="ブラウザで遊べるMinecraftテーマのミニゲーム集です。">
<meta property="og:url" content="https://tanikawayosiyukiwol-cmd.github.io/minecraft-the-mod/games/">
<meta property="og:image" content="https://tanikawayosiyukiwol-cmd.github.io/minecraft-the-mod/ogp-image.jpg">
<meta property="og:site_name" content="マインクラフト.the.Mod">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7faf8;--surface:#ffffff;--surface2:#eef6f0;
  --border:rgba(46,230,107,.22);--border2:rgba(46,230,107,.4);
  --cyan:#2ee66b;--gold:#ff5252;--text:#16241b;--muted:#5f7466;--muted2:#93a89b;
  --pixel:"Press Start 2P";--sans:"Noto Sans JP",sans-serif;--mono:"JetBrains Mono",monospace;--r:6px;--r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto;padding:0 1.5rem}
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border2);height:56px;display:flex;align-items:center;padding:0 1.5rem}
.topbar a{color:var(--muted);text-decoration:none;font-size:13px}
.topbar a:hover{color:var(--cyan)}
h1{font-family:var(--pixel);font-size:clamp(13px,3vw,18px);line-height:1.9;color:var(--text);padding:2.5rem 0 .5rem}
.sub{color:var(--muted);font-size:13px;margin-bottom:2rem;line-height:1.8}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem;padding-bottom:2rem}
.g-card{display:block;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);
  overflow:hidden;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s}
.g-card:hover{transform:translateY(-3px)}
.g-thumb{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;background:linear-gradient(135deg,#eafaf0,#d7f5e2)}
.g-info{padding:.9rem 1.1rem}
.g-title{font-size:13.5px;font-weight:700;margin-bottom:.3rem}
.g-desc{font-size:11.5px;color:var(--muted);line-height:1.6}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
footer{padding:2.5rem 0;text-align:center;color:var(--muted2);font-size:11.5px;font-family:var(--mono);
  border-top:1px solid var(--border);margin-top:1rem}
</style>
</head>
<body>
<div class="topbar"><a href="/minecraft-the-mod/">← マインクラフト.the.Mod トップへ戻る</a></div>
<div class="wrap">
  <h1>🕹️ ミニゲーム</h1>
  <p class="sub">ブラウザだけで遊べる、Minecraftテーマのミニゲームです。</p>

  <div class="grid" id="game-grid"></div>

  <footer>© マインクラフト.the.Mod — Not affiliated with Mojang Studios.</footer>
</div>

<script src="/minecraft-the-mod/transition.js"></script>
<script>
async function run(){
  let items = [];
  try{
    const res = await fetch("/minecraft-the-mod/games.json");
    items = await res.json();
  }catch{ items = []; }

  const pub = items.filter(a => a.published);
  const grid = document.getElementById("game-grid");

  if(!pub.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">まだゲームがありません。</div>`;
    return;
  }

  grid.innerHTML = pub.map(g => `
    <a class="g-card" onclick="event.preventDefault();pageGoTo('/minecraft-the-mod/${g.id}/')" href="/minecraft-the-mod/${g.id}/">
      <div class="g-thumb">${g.icon || "🎮"}</div>
      <div class="g-info">
        <div class="g-title">${g.title}</div>
        <div class="g-desc">${g.desc || ""}</div>
      </div>
    </a>
  `).join("");
}
run();
</script>
</body>
</html>
