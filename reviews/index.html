<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){
  try{
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/minecraft-the-mod/site-config.json?t=' + Date.now(), false);
    xhr.send(null);
    if(xhr.status === 200){
      var cfg = JSON.parse(xhr.responseText);
      if(cfg.maintenance === true && location.pathname.indexOf('/maintenance/') === -1){
        location.replace('/minecraft-the-mod/maintenance/');
      }
    }
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>レビュー・感想 | マインクラフト.the.Mod</title>
<link rel="icon" type="image/png" sizes="32x32" href="/minecraft-the-mod/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/minecraft-the-mod/favicon-16.png">

<link rel="icon" type="image/x-icon" href="/minecraft-the-mod/favicon.ico">

<meta property="og:type" content="website">

<style>
:root{
  --bg:#f7faf8;--surface:#ffffff;--surface2:#eef6f0;
  --border:rgba(46,230,107,.22);--border2:rgba(46,230,107,.4);
  --cyan:#2ee66b;--gold:#ff5252;--text:#16241b;--muted:#5f7466;--muted2:#93a89b;
  --pixel:"Press Start 2P";--sans:"Noto Sans JP",sans-serif;--mono:"JetBrains Mono",monospace;--r:6px;--r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding:0 1.5rem}
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border2);height:56px;display:flex;align-items:center;padding:0 1.5rem}
.topbar a{color:var(--muted);text-decoration:none;font-size:13px}
.topbar a:hover{color:var(--cyan)}
h1{font-family:var(--pixel);font-size:clamp(13px,3vw,18px);line-height:1.9;color:var(--text);padding:2.5rem 0 .5rem}
.sub{color:var(--muted);font-size:13px;margin-bottom:1.6rem;line-height:1.8}

.cta{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--surface2);
  border:1px solid var(--border2);border-radius:var(--r2);padding:1rem 1.3rem;margin-bottom:1.8rem;flex-wrap:wrap}
.cta p{font-size:12.5px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:none;cursor:pointer;font-weight:700;
  border-radius:var(--r);padding:.6rem 1.2rem;font-size:12.5px;text-decoration:none;white-space:nowrap;
  background:linear-gradient(135deg,var(--cyan),#17c765);color:#04170c}

.review-card{display:block;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);
  padding:1.3rem 1.5rem;margin-bottom:1rem;text-decoration:none;color:inherit;cursor:pointer;transition:border-color .15s}
.review-card:hover{border-color:var(--cyan)}
.stars{color:var(--gold);font-size:14px;margin-bottom:.4rem;letter-spacing:1px}
.review-title{font-size:14px;font-weight:700;margin-bottom:.4rem}
.review-body{font-size:12.5px;color:#3a4a40;line-height:1.8;margin-bottom:.6rem}
.review-meta{font-size:10.5px;color:var(--muted2);font-family:var(--mono)}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
footer{padding:2.5rem 0;text-align:center;color:var(--muted2);font-size:11.5px;font-family:var(--mono);
  border-top:1px solid var(--border);margin-top:1rem}
</style>
</head>
<body>
<div class="topbar"><a href="/minecraft-the-mod/">← マインクラフト.the.Mod トップへ戻る</a></div>
<div class="wrap">
  <h1>💬 レビュー・感想</h1>
  <p class="sub">Modを使ってくれた方からのレビュー・感想を紹介しています。</p>

  <div class="cta">
    <p>感想を送ってくれた方は、掲載させていただくことがあります。</p>
    <a href="/minecraft-the-mod/contact/" class="btn">✉ 感想を送る</a>
  </div>

  <div id="review-list"></div>

  <footer>© マインクラフト.the.Mod — Not affiliated with Mojang Studios.</footer>
</div>

<script src="/minecraft-the-mod/transition.js"></script>
<script>
async function run(){
  let items = [];
  try{
    const res = await fetch("/minecraft-the-mod/reviews.json");
    items = await res.json();
  }catch{ items = []; }

  const pub = items.filter(a => a.published).sort((a,b) => (b.date||"").localeCompare(a.date||""));
  const list = document.getElementById("review-list");

  if(!pub.length){
    list.innerHTML = `<div class="empty">まだレビューがありません。</div>`;
    return;
  }

  list.innerHTML = pub.map(r => {
    const stars = "★".repeat(r.rating||5) + "☆".repeat(5-(r.rating||5));
    return `
    <a class="review-card" onclick="event.preventDefault();pageGoTo('/minecraft-the-mod/${r.id}/')" href="/minecraft-the-mod/${r.id}/">
      <div class="stars">${stars}</div>
      <div class="review-title">${r.title}</div>
      <div class="review-body">${r.excerpt || ""}</div>
      <div class="review-meta">by ${r.author || "名無し"} ・ ${r.date}</div>
    </a>`;
  }).join("");
}
run();
</script>
</body>
</html>
